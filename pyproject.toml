[project]
name = "flowshop-tardiness"
version = "0.0.1"
description = "Flow shop scheduling to minimize total tardiness"
readme = "README.md"
requires-python = "==3.11.*"
dependencies = [
    "cplex>=22.1.2.0",
    "docplex>=2.27.239",
    "mbls",
    "ortools>=9.14.6206",
    "pydantic>=2.11.9",
    "pyyaml>=6.0.2",
    "routix",
    "ruff>=0.16.5",
    "schore",
    "xlsxwriter>=3.2.9",
]
license = { text = "MIT" }

[dependency-groups]
dev = [
    "pandas-stubs>=2.3.2.250827",
    "pytest>=8.4.2",
    "types-pyyaml>=6.0.12.20250915",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = "test_*.py"
python_functions = "test_*"
pythonpath = ["."]

[tool.ruff.format]
# ruff 0.16 formats Python blocks inside Markdown by default; plan/report docs
# quote historical code verbatim, so leave Markdown alone.
exclude = ["*.md"]

[tool.ruff.lint.per-file-ignores]
# checks/ scripts put the repo root on sys.path before importing the package,
# so their imports cannot all sit at the top of the file.
"checks/*.py" = ["E402"]
